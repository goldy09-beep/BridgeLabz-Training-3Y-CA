<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <style>

        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            color: #222;
        }

        /* Header */
        header {
            text-align: center;
            background-color: #1f2937;
            color: white;
            padding: 30px 20px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        /* Main section */
        main {
            padding: 40px 20px;
        }

        /* Image Grid */
        .gallery {
            display: grid;

            /* Three images in each row */
            grid-template-columns: repeat(3, 1fr);

            gap: 25px;

            max-width: 1100px;
            margin: auto;
        }

        /* Figure */
        figure {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);

            transition: 0.3s ease;
        }

        /* Image container */
        .image-box {
            position: relative;
            overflow: hidden;
        }

        /* Images */
        .image-box img {
            width: 100%;
            height: 230px;

            object-fit: cover;

            display: block;

            transition: transform 0.3s ease;
        }

        /* Semi-transparent overlay */
        .image-box::after {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.45);

            opacity: 0;

            transition: opacity 0.3s ease;
        }

        /* Scale image and show overlay on hover */
        figure:hover img {
            transform: scale(1.1);
        }

        figure:hover .image-box::after {
            opacity: 1;
        }

        /* Caption */
        figcaption {
            padding: 15px;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            color: #1f2937;
        }

        /* Footer */
        footer {
            margin-top: 40px;

            padding: 15px;

            background-color: #1f2937;
            color: white;

            text-align: center;
        }

        /* Responsive design below 700px */
        @media (max-width: 700px) {

            .gallery {
                grid-template-columns: 1fr;
            }

            .image-box img {
                height: 250px;
            }
        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1015/600/400"
                        alt="Mountain landscape">
                </div>

                <figcaption>Mountain Landscape</figcaption>
            </figure>


            <!-- Image 2 -->
            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1016/600/400"
                        alt="Beautiful nature">
                </div>

                <figcaption>Beautiful Nature</figcaption>
            </figure>


            <!-- Image 3 -->
            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1018/600/400"
                        alt="Forest landscape">
                </div>

                <figcaption>Forest View</figcaption>
            </figure>


            <!-- Image 4 -->
            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1019/600/400"
                        alt="Mountain and lake">
                </div>

                <figcaption>Mountain Lake</figcaption>
            </figure>


            <!-- Image 5 -->
            <figure>
                <div class="image-box">
                    <img src="https://picsum.photos/id/1020/600/400"

                <figcaption>Green Forest</figcaption>

            <!-- Image 6 -->

                <figcaption>Wildlife</figcaption>
            </figure>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Image Showcase using HTML and CSS</p>
    </footer>

</body>

</html>
