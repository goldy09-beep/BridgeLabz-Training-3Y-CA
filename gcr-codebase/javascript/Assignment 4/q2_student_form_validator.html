
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 12px #0000001a;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        input.valid {
            border-color: green;
        }

        input.invalid {
            border-color: red;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            min-height: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Student Registration</h2>

        <form id="studentForm" novalidate>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div class="error" id="nameError"></div>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="example@domain.com">
            <div class="error" id="emailError"></div>

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="10-digit phone number">
            <div class="error" id="phoneError"></div>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password">
            <div class="error" id="passwordError"></div>

            <button type="submit">Register</button>
            <div id="result"></div>
        </form>
    </div>

    <script>
        "use strict";

        const form = document.getElementById("studentForm");

        // Validation patterns
        const namePattern = /^[A-Za-z]+$/;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phonePattern = /^\d{10}$/;
        const passwordPattern =
            /^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9\s])\S+$/;

        // Validate one field and update its appearance
        function validateField(fieldId, pattern, message) {
            const input = document.getElementById(fieldId);
            const error = document.getElementById(fieldId + "Error");
            const value = input.value.trim();

            if (!pattern.test(value)) {
                input.classList.add("invalid");
                input.classList.remove("valid");
                error.textContent = message;
                return false;
            }

            input.classList.add("valid");
            input.classList.remove("invalid");
            error.textContent = "";

            return true;
        }

        // Validate all fields when the form is submitted
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const isNameValid = validateField(
                "name",
                namePattern,
                "Name must contain alphabets only."
            );

            const isEmailValid = validateField(
                "email",
                emailPattern,
                "Enter a valid email, e.g. example@domain.com."
            );

            const isPhoneValid = validateField(
                "phone",
                phonePattern,
                "Phone number must contain exactly 10 digits."
            );

            const isPasswordValid = validateField(
                "password",
                passwordPattern,
                "Password needs an uppercase letter, a number, and a special character."
            );

            const result = document.getElementById("result");

            if (
                isNameValid &&
                isEmailValid &&
                isPhoneValid &&
                isPasswordValid
            ) {
                result.style.color = "green";
                result.textContent = "Registration form is valid!";
                console.log("All form fields are valid.");
            } else {
                result.style.color = "red";
                result.textContent = "Please correct the invalid fields.";
                console.log("Form validation failed.");
            }
        });

        // Clear the previous validation state while editing
        form.querySelectorAll("input").forEach(function (input) {
            input.addEventListener("input", function () {
                input.classList.remove("valid", "invalid");

                document.getElementById(
                    input.id + "Error"
                ).textContent = "";

                document.getElementById("result").textContent = "";
            });
        });
    </script>
</body>
</html>
