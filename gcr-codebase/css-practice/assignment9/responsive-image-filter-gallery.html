
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="page-header">
        <h1>Responsive Image Filter Gallery</h1>
        <p>Different CSS filters applied to images</p>
    </header>

    <!-- ================= MAIN CONTENT ================= -->
    <main>
        <section class="gallery-section">

            <h2>Image Gallery</h2>

            <div class="gallery">

                <!-- Blur Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1015/600/400"
                        alt="Mountain landscape with river"
                        class="blur">
                    <figcaption>Blur</figcaption>
                </figure>

                <!-- Grayscale Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1025/600/400"
                        alt="Dog sitting outdoors"
                        class="grayscale">
                    <figcaption>Grayscale</figcaption>
                </figure>

                <!-- Sepia Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1035/600/400"
                        alt="Landscape near the sea"
                        class="sepia">
                    <figcaption>Sepia</figcaption>
                </figure>

                <!-- Brightness Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1043/600/400"
                        alt="Forest and mountains"
                        class="brightness">
                    <figcaption>Brightness</figcaption>
                </figure>

                <!-- Contrast Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1050/600/400"
                        alt="Mountain scenery"
                        class="contrast">
                    <figcaption>Contrast</figcaption>
                </figure>

                <!-- Hue Rotate Filter -->
                <figure>
                    <img
                        src="https://picsum.photos/id/1069/600/400"
                        alt="Nature landscape"
                        class="hue-rotate">
                    <figcaption>Hue Rotate</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>

</html>
