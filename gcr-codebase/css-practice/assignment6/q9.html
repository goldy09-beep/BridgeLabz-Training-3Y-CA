<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="q9.css" />
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <!-- Front Side -->
        <div class="card-front">
          <h2>Explore Nature</h2>
          <img
            src="https://picsum.photos/id/1018/300/200"
            alt="Beautiful nature"
          />
          <p>Hover to discover more!</p>
        </div>

        <!-- Back Side -->
        <div class="card-back">
          <h2>About Nature</h2>
          <p>
            Nature gives us fresh air, beautiful landscapes and a peaceful
            environment. Protecting nature is important for a healthy future.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
