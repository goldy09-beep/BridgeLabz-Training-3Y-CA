<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini User Interface</title>

    <style>

        /* ------------------------------
           Global Styling
        ------------------------------ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);

            min-height: 100vh;
            padding: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ------------------------------
           Main Layout
        ------------------------------ */

        .page {
            width: 100%;
            max-width: 900px;
            min-height: 600px;

            background-color: white;

            border: 1px solid #d1d5db;
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }


        /* ------------------------------
           Header
        ------------------------------ */

        header {
            background-color: #1e3a8a;
            color: white;

            padding: 25px 35px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        header h1 {
            font-size: 28px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;

            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #bfdbfe;
        }


        /* ------------------------------
           Main Content
        ------------------------------ */

        main {
            flex: 1;

            padding: 40px;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ------------------------------
           Content Card
        ------------------------------ */

        .content-card {
            width: 100%;
            max-width: 650px;

            padding: 30px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            background-color: #f8fafc;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);

            display: flex;
            align-items: center;
            gap: 30px;
        }


        /* ------------------------------
           Image Styling
        ------------------------------ */

        .content-card img {
            width: 180px;
            height: 180px;

            object-fit: cover;

            border: 4px solid white;
            border-radius: 12px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }


        /* ------------------------------
           Form Styling
        ------------------------------ */

        .form-section {
            flex: 1;
        }

        .form-section h2 {
            margin-bottom: 10px;
            color: #1e293b;
        }

        .form-section p {
            margin-bottom: 20px;
            color: #64748b;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;

            font-weight: bold;
            color: #334155;
        }

        input,
        textarea {
            width: 100%;

            padding: 11px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 14px;

            transition: border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }


        /* Focus Pseudo-class */

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.20);
        }


        /* ------------------------------
           Buttons
        ------------------------------ */

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 20px;

            border: none;
            border-radius: 6px;

            font-size: 14px;
            cursor: pointer;

            transition: background-color 0.3s ease,
                        transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .submit-btn {
            background-color: #2563eb;
            color: white;
        }

        .reset-btn {
            background-color: #e2e8f0;
            color: #1e293b;
        }


        /* Hover Pseudo-class */

        button:hover {
            transform: translateY(-2px);

            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        .reset-btn:hover {
            background-color: #cbd5e1;
        }


        /* Active Pseudo-class */

        button:active {
            transform: translateY(0);
        }


        /* Focus Pseudo-class */

        button:focus {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }


        /* ------------------------------
           Footer
        ------------------------------ */

        footer {
            background-color: #f1f5f9;

            padding: 20px;

            text-align: center;

            border-top: 1px solid #d1d5db;

            color: #64748b;
            font-size: 14px;
        }


        /* ------------------------------
           Responsive Design
        ------------------------------ */

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            header {
                flex-direction: column;
                text-align: center;
            }

            nav {
                gap: 15px;
            }

            main {
                padding: 20px;
            }

            .content-card {
                flex-direction: column;
                text-align: center;
            }

            .form-section {
                width: 100%;
            }

            .buttons {
                justify-content: center;
            }
        }

        @media (max-width: 400px) {

            header h1 {
                font-size: 23px;
            }

            .content-card {
                padding: 20px;
            }

            .content-card img {
                width: 140px;
                height: 140px;
            }

            .buttons button {
                width: 100%;
            }
        }

    </style>
</head>


<body>

    <div class="page">

        <!-- Header -->

        <header>
            <h1>My Mini UI</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>


        <!-- Main Content -->

        <main>

            <section class="content-card">

                <!-- Small Image -->

                <img
                    src="https://picsum.photos/180"
                    alt="Sample landscape image"
                >


                <!-- Form Section -->

                <div class="form-section">

                    <h2>Contact Us</h2>

                    <p>
                        Fill out the form below to send us a message.
                    </p>

                    <form>

                        <div class="form-group">
                            <label for="name">Name</label>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>


                        <div class="form-group">
                            <label for="message">Message</label>

                            <textarea
                                id="message"
                                placeholder="Write your message"
                            ></textarea>
                        </div>


                        <div class="buttons">

                            <button
                                type="submit"
                                class="submit-btn"
                            >
                                Submit
                            </button>

                            <button
                                type="reset"
                                class="reset-btn"
                            >
                                Reset
                            </button>

                        </div>

                    </form>

                </div>

            </section>

        </main>


        <!-- Footer -->

        <footer>
            <p>&copy; 2026 My Mini UI. All rights reserved.</p>
        </footer>

    </div>

</body>

</html>
