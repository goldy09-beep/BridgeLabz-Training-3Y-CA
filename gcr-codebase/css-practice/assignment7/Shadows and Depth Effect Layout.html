<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Depth Effect</title>

    <style>
        /* Basic styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 40px;
        }

        /* Main heading with text-shadow */
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
            text-shadow: 2px 2px 4px gray;
        }

        /* Arrange cards in a single row */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        /* Common card styling */
        .card {
            width: 250px;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;

            /* Smooth hover animation */
            transition: 0.3s;
        }

        /* Different box-shadow styles */
        .card1 {
            box-shadow: 5px 5px 10px gray;
        }

        .card2 {
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .card3 {
            box-shadow: 2px 2px 20px rgba(0, 0, 0, 0.4);
        }

        /* Card headings */
        .card h2 {
            margin-bottom: 15px;
            color: #333;
            text-shadow: 1px 1px 3px lightgray;
        }

        .card p {
            color: #555;
            line-height: 1.5;
        }

        /* Lift card up when mouse hovers */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body>

    <h1>Shadows and Depth Effect</h1>

    <main>
        <div class="cards-container">

            <!-- Card 1 -->
            <div class="card card1">
                <h2>Profile Card</h2>
                <p>
                    This card uses a simple shadow to create
                    a basic depth effect.
                </p>
            </div>

            <!-- Card 2 -->
            <div class="card card2">
                <h2>Content Card</h2>
                <p>
                    This card uses a soft shadow around the
                    bottom to create depth.
                </p>
            </div>

            <!-- Card 3 -->
            <div class="card card3">
                <h2>Design Card</h2>
                <p>
                    This card uses a wider shadow to create
                    a stronger depth effect.
                </p>
            </div>

        </div>
    </main>

</body>
</html>
