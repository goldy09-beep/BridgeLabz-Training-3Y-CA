<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Outline and Focus Form</title>

    <style>

        /* Basic page styling */
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Center the form using Flexbox */
        main {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form container */
        form {
            width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Keep uniform spacing between form elements */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        /* Input and textarea styling */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;

            /* Smooth outline transition */
            transition: outline 0.3s;
        }

        /* Different outline style for input */
        input {
            outline: 2px solid transparent;
            outline-offset: 3px;
        }

        /* Different outline style for textarea */
        textarea {
            min-height: 120px;
            resize: vertical;
            outline: 2px dashed transparent;
            outline-offset: 4px;
        }

        /* Change outline color when input gets focus */
        input:focus {
            border-color: #3498db;
            outline: 2px solid #3498db;
            outline-offset: 3px;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.25);
        }

        /* Change outline color when textarea gets focus */
        textarea:focus {
            border-color: #27ae60;
            outline: 2px dashed #27ae60;
            outline-offset: 4px;
            box-shadow: 0 0 8px rgba(39, 174, 96, 0.25);
        }

        /* Button styling */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

    </style>
</head>

<body>

    <main>

        <form>

            <h1>Contact Form</h1>

            <!-- Name input -->
            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">
            </div>

            <!-- Email input -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">
            </div>

            <!-- Message textarea -->
            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    placeholder="Write your message"></textarea>
            </div>

            <!-- Submit button -->
            <button type="submit">Submit</button>

        </form>

    </main>

</body>
</html>
