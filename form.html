        input[type="radio"] , input[type="checkbox"]{
            width: auto;

        .form-container{
            height : 570px;

<body>
     <h1> Student registration portal</h1>
    <form action="/register" method="post" class="form-container">
        <p>
        <label for="full name">Full Name:</label>
        <input type="text" id="fullname" , name="fullname" placeholder="Enter your full name">
        <br>
        </p>
        <p>
        <label for="email">Email:</label>
        <input type="Email" id="email" , name="email" placeholder="Enter your email">
        <br>
        </p>
        <p>
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age"> <br>
        </p>
        <p>
        <label for="dob">Date Of Birth</label>
        <input type = "date" id="dob" name = "dob" placeholder="enter your date of birth."> <br>
        </p>
        
        <label>Gender:</label> 
        <input type = "radio" value="male" name="gender" id="male"> 
        <label for="male">Male</label> 
        <input type = "radio" value="female" name="gender" id="female" required>  
        <label > Female</label> 
        
        <p>
        <label> skills: </label> <br>
        <label>java:</label>
        <input type ="checkbox" id="java" name="Skills" value="java"> 
        <label>python:</label>
        <input type = "checkbox" id="python" name="Skills" value="python"> <br>
        <label>javascript:</label>
        <input type="checkbox" id = "javascript" name="skills" value="javasript"> <br>
        </p>
        <p>
        <label>Select Branch:</label> <br>
        <select name = "id">
            <option value="cse" id="">CSE</option>
            <option value="it" id="">IT</option>
            <option value="ece" id="">ECE</option>
        </select> <br>
        </p>
        <p>
         <button type = "Submit">Submit:</button> 
        <br>
        </p>
