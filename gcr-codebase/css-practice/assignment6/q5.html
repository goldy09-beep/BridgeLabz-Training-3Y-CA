
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Choose Your Plan</h1>

    <!-- Pricing Section -->
    <section class="pricing-container">

        <!-- Basic Plan -->
        <div class="card">
            <h2>Basic</h2>
            <h3>₹499/month</h3>
            <p>5 Projects</p>
            <p>Basic Support</p>
            <p>Limited Storage</p>
            <button>Choose Plan</button>
        </div>

        <!-- Standard Plan -->
        <div class="card featured">
            <h2>Standard</h2>
            <h3>₹999/month</h3>
            <p>15 Projects</p>
            <p>Priority Support</p>
            <p>50 GB Storage</p>
            <button>Choose Plan</button>
        </div>

        <!-- Premium Plan -->
        <div class="card">
            <h2>Premium</h2>
            <h3>₹1499/month</h3>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <p>Unlimited Storage</p>
            <button>Choose Plan</button>
        </div>

    </section>

</body>
</html>
