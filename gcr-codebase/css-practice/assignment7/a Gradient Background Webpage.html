<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background Page</title>

    <style>
        /* Basic page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        /* Common section styling */
        section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 100px 20px;
        }

        /* Linear Gradient Section */
        .linear-section {
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        /* Radial Gradient Section */
        .radial-section {
            background: radial-gradient(circle, #ff9966, #ff5e62);
        }

        /* Text inside sections */
        .content {
            max-width: 700px;
        }

        h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        /* Parallax-like effect */
        .linear-section {
            background-attachment: fixed;
        }

        /* Fixed Footer */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #222;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Fixed Header -->
    <header>
        <h1>Gradient Backgrounds</h1>
    </header>

    <main>

        <!-- Linear Gradient Section -->
        <section class="linear-section">
            <div class="content">
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient.
                    The colors gradually change from one side to another.
                </p>
            </div>
        </section>

        <!-- Radial Gradient Section -->
        <section class="radial-section">
            <div class="content">
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient.
                    The colors spread outward from the center.
                </p>
            </div>
        </section>

    </main>

    <!-- Fixed Footer -->
    <footer>
        <p>Gradient Background Demo</p>
    </footer>

</body>
</html>
