
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside>
            <h3>Navigation</h3>
            <nav>
                <a href="#dashboard">Dashboard</a>
                <a href="#profile">Profile</a>
                <a href="#settings">Settings</a>
                <a href="#reports">Reports</a>
                <a href="#logout">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main id="dashboard">

            <div class="box box1">
                <h3>Overview</h3>
                <p>Welcome to your dashboard.</p>
            </div>

            <div class="box box2">
                <h3>Users</h3>
                <p>Total Users: 120</p>
            </div>

            <div class="box box3">
                <h3>Projects</h3>
                <p>Total Projects: 15</p>
            </div>

            <div class="box box4">
                <h3>Analytics</h3>
                <p>View your performance and statistics.</p>
            </div>

        </main>

    </div>

</body>
</html>
