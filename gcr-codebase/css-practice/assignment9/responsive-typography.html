
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Typography</title>

    <style>
        /* ================= GENERAL STYLING ================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;

            display: flex;
            flex-direction: column;
        }


        /* ================= HEADER ================= */

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        header h1 {
            /* Required clamp() function */
            font-size: clamp(1.5rem, 4vw, 3rem);
        }


        /* ================= MAIN SECTION ================= */

        main {
            flex: 1;
        }

        .content-section {
            max-width: 900px;
            margin: 60px auto;
            padding: 40px 30px;

            text-align: center;

            background-color: white;
            border-radius: 10px;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .content-section h2 {
            margin-bottom: 25px;
        }

        .content-section p {
            /* Required clamp() function */
            font-size: clamp(1rem, 2vw, 1.5rem);

            line-height: 1.7;
        }


        /* ================= FOOTER ================= */

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }


        /* ================= RESPONSIVE DESIGN ================= */

        /* Below 700px */

        @media (max-width: 700px) {

            .content-section {
                margin: 30px 15px;
                padding: 25px 20px;
            }

            .content-section h2 {
                margin-bottom: 18px;
            }

            .content-section p {
                line-height: 1.8;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <h1>Responsive Typography</h1>
    </header>


    <!-- ================= MAIN CONTENT ================= -->

    <main>

        <section class="content-section">

            <h2>Design That Adapts</h2>

            <p>
                Responsive typography allows text to automatically adjust
                according to the screen size. Using relative units and the
                clamp() function helps maintain comfortable and readable
                text across desktops, tablets and mobile devices.
            </p>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>
        <p>&copy; 2026 Responsive Typography</p>
    </footer>

</body>

</html>
