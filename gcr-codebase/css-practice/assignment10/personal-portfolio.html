<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Goldy Pandey | Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white py-4">
        <div class="container text-center">

            <h1 class="fw-bold mb-3">
                Goldy Pandey
            </h1>

            <p class="mb-0">
                Cloud & DevOps Enthusiast | Software Developer
            </p>

        </div>
    </header>

    <!-- Main -->
    <main>

        <!-- Profile Section -->
        <section class="hero bg-light">

            <div class="container text-center">

                <!-- img-fluid makes image responsive -->
                <!-- rounded-circle creates circular image -->
                <img src="https://picsum.photos/300"
                    alt="Profile"
                    class="img-fluid rounded-circle profile-img mb-4">

                <h2 class="fw-bold">
                    Hello, I'm Goldy
                </h2>

                <p class="lead text-muted mt-3">
                    I enjoy building software solutions and exploring
                    cloud technologies, DevOps and modern web development.
                </p>

                <div class="mt-4">

                    <a href="#contact" class="btn btn-primary me-2">
                        Hire Me
                    </a>

                    <a href="#" class="btn btn-outline-dark">
                        Download CV
                    </a>

                </div>

            </div>

        </section>

        <!-- Contact -->
        <section id="contact" class="py-5">

            <div class="container">

                <h2 class="text-center fw-bold mb-4">
                    Contact Me
                </h2>

                <div class="row justify-content-center">

                    <div class="col-md-7">

                        <form>

                            <div class="mb-3">
                                <label class="form-label">
                                    Name
                                </label>

                                <input type="text"
                                    class="form-control"
                                    placeholder="Enter your name">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                    class="form-control"
                                    placeholder="Enter your email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Message
                                </label>

                                <textarea class="form-control"
                                    rows="5"
                                    placeholder="Write your message">
                                </textarea>
                            </div>

                            <button class="btn btn-primary w-100">
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Goldy Pandey
        </p>
    </footer>

</body>
</html>
