
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Section -->
    <main id="home">

        <div class="box" id="services">
            <h2>Services</h2>
            <p>We provide quality services to our customers.</p>
        </div>

        <div class="box" id="projects">
            <h2>Projects</h2>
            <p>Explore our creative and innovative projects.</p>
        </div>

        <div class="box" id="contact">
            <h2>Contact</h2>
            <p>Get in touch with us for more information.</p>
        </div>

    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
