
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 30px;
        }

        .container {
            max-width: 420px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        #ticket {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e8f8ee;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Movie Ticket Booking</h2>

        <form id="bookingForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
            <div id="nameError" class="error"></div>

            <label for="email">Email Address</label>
            <input type="text" id="email" placeholder="Enter your email">
            <div id="emailError" class="error"></div>

            <label for="seats">Number of Seats (1–10)</label>
            <input type="number" id="seats" placeholder="Enter seats" min="1" max="10">
            <div id="seatsError" class="error"></div>

            <button type="submit">Book Tickets</button>
        </form>

        <div id="ticket">
            <h3>Booking Confirmed!</h3>
            <p id="ticketDetails"></p>
        </div>
    </div>

    <script>
        "use strict";

        // Regular expressions for validation
        const namePattern = /^[A-Za-z]+(?:[ '-][A-Za-z]+)*$/;
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Handle form submission
        document.getElementById("bookingForm").addEventListener("submit", function(event) {
            event.preventDefault();

            // Get user input
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const seatsInput = document.getElementById("seats").value.trim();
            const seats = Number(seatsInput);

            // Clear previous error messages
            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("seatsError").textContent = "";
            document.getElementById("ticket").style.display = "none";

            let isValid = true;

            // Validate name: alphabets, spaces, apostrophes and hyphens
            if (!namePattern.test(name)) {
                document.getElementById("nameError").textContent =
                    "Enter a valid name using alphabets only.";
                isValid = false;
            }

            // Validate email format
            if (!emailPattern.test(email)) {
                document.getElementById("emailError").textContent =
                    "Please enter a valid email address.";
                isValid = false;
            }

            // Validate seats: whole number from 1 to 10
            if (
                seatsInput === "" ||
                !Number.isInteger(seats) ||
                seats < 1 ||
                seats > 10
            ) {
                document.getElementById("seatsError").textContent =
                    "Seats must be a whole number between 1 and 10.";
                isValid = false;
            }

            // Store and display booking only if all inputs are valid
            if (isValid) {
                const booking = {
                    name: name,
                    email: email,
                    seats: seats
                };

                console.log("Booking Information:", booking);

                document.getElementById("ticketDetails").textContent =
                    `Name: ${booking.name}\n` +
                    `Email: ${booking.email}\n` +
                    `Seats: ${booking.seats}`;

                document.getElementById("ticket").style.display = "block";
            }
        });
    </script>

</body>
</html>
